[project]
name = "posture"
version = "0.1.0"
description = "Control an IKEA Idasen desk and track sitting and standing time."
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.162.7",
    "holidays>=0.108",
    "idasen>=0.14.0",
    "loguru>=0.8.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
posture = "posture.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit", "pytest", "pytest-cov", "ruff", "ty"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the formatter
  "ISC001", # conflicts with the formatter
  "D203",   # incompatible with D211, which we keep
  "D213",   # incompatible with D212, which we keep
  "D1",     # docstrings are not required
  "CPY001", # no copyright header policy; not in the agreed ignore list, flagged for review
]

[tool.ruff.lint.flake8-type-checking]
# FastAPI resolves these annotations at runtime, so they must stay real imports.
exempt-modules = ["typing", "fastapi", "starlette"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # pytest uses plain assert
  "PLR2004", # magic values are fine in test data
]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
addopts = "--cov=posture.domain --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
