name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: tar -czf "posture-frontend-${GITHUB_REF_NAME}.tar.gz" -C frontend/dist .
      - run: gh release create "$GITHUB_REF_NAME" "posture-frontend-${GITHUB_REF_NAME}.tar.gz" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
